<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#16231d;--mute:#6b7a73;--line:#e5eae7;--brand:#0f3d2e;--brand2:#16a34a;
  --in:#067647;--out:#c0262d;--debt:#b54708;--xfer:#2f6fb0;--plan:#7a5af8;--warnbg:#fef3f2;--okbg:#ecfdf3;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px 8px;display:flex;align-items:center;gap:8px}
.wchip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;min-width:0;flex:1;max-width:330px;cursor:pointer}
.wchip .tx{min-width:0;text-align:left;line-height:1.15}
.wchip .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip .tx span{font-size:12.5px;color:var(--mute)}
.htitle{flex:1;text-align:center;font-size:20px;font-weight:800}
.hbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.monthbar{display:flex;align-items:center;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.monthbar::-webkit-scrollbar{display:none}
.monthbar button{flex:none;border:none;background:none;color:var(--mute);font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer}
.monthbar button.on{background:var(--ink);color:#fff}
main{max-width:900px;margin:0 auto;padding:4px 16px 120px}
nav.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;display:flex;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
nav.tabs button{flex:1;background:none;border:none;padding:6px 2px;color:var(--ink);font-size:12px;font-weight:600;border-radius:999px;cursor:pointer}
nav.tabs button b{display:block;font-size:18px;line-height:1.25}
nav.tabs button.on{background:#e9f7ef;color:var(--brand2)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:50%;border:none;background:var(--brand2);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(22,163,74,.4);cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
@media(max-width:560px){.kpi{padding:9px 8px}.kpi .v{font-size:14px;letter-spacing:-.3px}.kpi .k{font-size:11px}.kpi .s{font-size:10.5px}}
@media(max-width:385px){.kpis{grid-template-columns:1fr;gap:6px}.kpi{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:9px 14px}.kpi .k{grid-column:1;font-size:12.5px}.kpi .s{grid-column:1;font-size:11px}.kpi .v{grid-column:2;grid-row:1 / span 2;font-size:17px;margin:0}}
.neg{color:var(--out)!important}.pos{color:var(--in)}
.alert{border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.alert.bad{background:var(--warnbg);color:var(--out)}
.alert.ok{background:var(--okbg);color:var(--in)}
h2{font-size:15.5px;margin:0 0 8px}
.ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;color:#fff;font-weight:800}
.ic.sm{width:32px;height:32px;font-size:15px}
.ic.line{background:none!important;color:var(--ink);font-size:22px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m .c{font-weight:700}
.row .m .n{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:700;white-space:nowrap;text-align:right}
.chev{color:#b8c1bc;font-size:22px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.plan{background:#f4f3ff;color:var(--plan)}
.tag.late{background:var(--warnbg);color:var(--out)}
.dayh{display:flex;align-items:center;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.dayh .dn{font-size:34px;font-weight:700;line-height:1;width:46px}
.dayh .dw{flex:1;color:var(--mute);font-size:13px;line-height:1.3}
.dayh .dt{font-weight:800}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--out)}
.muted{color:var(--mute);font-size:13px}
.sec-t{font-size:13px;font-weight:800;color:var(--mute);letter-spacing:.4px;margin:16px 4px 6px}
.prof{text-align:center;padding:20px 16px}
.prof .av{width:72px;height:72px;border-radius:50%;background:var(--brand2);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
/* grid */
.gridwrap{overflow:auto;border-radius:16px;background:#fff;max-height:calc(100vh - 220px)}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
table.g th,table.g td{padding:5px 8px;border-bottom:1px solid #eef1ef;border-right:1px solid #eef1ef;text-align:right}
table.g thead th{position:sticky;top:0;background:#f7f9f8;z-index:2;font-weight:700}
table.g .c0{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:140px;font-weight:600}
table.g thead .c0{z-index:3;background:#f7f9f8}
table.g tr.sec td,table.g tr.sec td.c0{background:#eef4f1;font-weight:800;color:var(--brand)}
table.g tr.tot td,table.g tr.tot td.c0{font-weight:800;background:#fafbfa}
table.g tr.bal td,table.g tr.bal td.c0{font-weight:800;background:#f0f7f3}
table.g td.cell{cursor:pointer}
table.g td.p{color:var(--plan)}
table.g .today{box-shadow:inset 0 0 0 9999px rgba(22,163,74,.07)}
table.g th.we{color:var(--out)}
/* sheet / form (แบบ Add Transaction) */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:22px}}
.sheet .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet .top h3{flex:1;text-align:center;margin:0;font-size:18px}
.sheet .top .hbtn{width:38px;height:38px}
.seg{display:flex;background:#e8ebe9;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;padding:8px 2px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fgroup{background:#fff;border-radius:18px;padding:2px 14px;margin-bottom:10px}
.frow{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:52px}
.frow+.frow{border-top:1px solid var(--line)}
.frow .fi{width:32px;text-align:center;font-size:20px;flex:none}
.frow .fx{flex:1;min-width:0}
.frow .lab{font-size:12px;color:var(--mute)}
.frow select,.frow input{width:100%;border:none;background:none;font-size:16px;font-weight:600;padding:2px 0;outline:none}
.frow .amt{font-size:30px;font-weight:700}
.cur{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;color:var(--mute);font-size:13px;flex:none}
.datebar{display:flex;align-items:center;gap:8px;flex:1}
.datebar .db{flex:1;position:relative;background:#f2f4f3;border-radius:10px;text-align:center;padding:8px;font-weight:700;color:var(--brand2)}
.datebar .db input{position:absolute;inset:0;opacity:0;width:100%}
.datebar .arr{width:36px;height:36px;border-radius:50%;border:none;background:#e9f7ef;color:var(--brand2);font-size:18px;font-weight:800;cursor:pointer}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--plan)}
.savebar{display:flex;gap:8px;margin-top:6px}
.savebar .btn{flex:1;padding:13px;border-radius:999px;font-size:16px}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.inp{width:100%;padding:10px 12px;border:1px solid #cfd8d3;border-radius:12px;background:#fff;font-size:16px}
label.f{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin:10px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:#16231d;color:#fff;padding:9px 16px;border-radius:10px;z-index:60;font-weight:600}
.spark{width:100%;height:120px}
.menu{position:fixed;z-index:55;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:230px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:12px;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;text-align:left}
.menu button:hover{background:#f2f4f3}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #d6ddd9;background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
</style>
</head>
<body>

<div id="loginView" class="login hide">
  <div class="card">
    <div style="font-size:22px;font-weight:800;color:var(--brand)">💰 Cashflow</div>
    <div class="muted" style="margin-bottom:12px">กระแสเงินสดบริษัท</div>
    <label class="f">อีเมล</label><input id="lgEmail" class="inp" type="email" autocomplete="username">
    <label class="f">รหัสผ่าน</label><input id="lgPass" class="inp" type="password" autocomplete="current-password">
    <div class="savebar" style="margin-top:14px"><button class="btn pri" id="lgBtn">เข้าสู่ระบบ</button></div>
    <div id="lgErr" class="muted neg" style="margin-top:8px"></div>
  </div>
</div>

<div id="appView" class="hide">
  <header id="hdr"></header>
  <div class="monthbar" id="monthBar"></div>
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="บันทึกรายการ">+</button>
  <nav class="tabs">
    <button data-tab="home" class="on"><b>🏠</b>ภาพรวม</button>
    <button data-tab="list"><b>🧾</b>รายการ</button>
    <button data-tab="grid"><b>📅</b>ตาราง</button>
    <button data-tab="budget"><b>🎯</b>งบ</button>
    <button data-tab="more"><b>👤</b>เพิ่มเติม</button>
  </nav>
</div>
<div id="modal"></div>

<script>
// ===================== ตั้งค่าโปรเจกต์ Supabase (Fillbook) =====================
// anon key เปิดเผยได้โดยออกแบบ — ตัวป้องกันจริงคือ RLS (owner = auth.uid()) + ต้อง login
const CF_SUPABASE_URL = 'https://xgpsdcnqravhouwaktgp.supabase.co';
const CF_SUPABASE_ANON = 'sb_publishable_HGOrB_SgTUq22r67me1B5Q_KYhNoL7B';   // publishable key (Fillbook)
const CF_VERSION = '2026-11-08n';
// =============================================================================

const GRP={in:{label:'เงินเข้า',sign:1,color:'#067647',icon:'⬇'},debt:{label:'ชำระหนี้',sign:-1,color:'#b54708',icon:'🏦'},exp:{label:'ค่าใช้จ่าย',sign:-1,color:'#c0262d',icon:'⬆'}};
const GRP_ORDER=['in','exp'];   // หมวด flow · หนี้/เงินยืม แยกไปใช้ cf_parties + kind 'loan'
// หนี้/เงินยืม: sign = ผลต่อเงินในบัญชี = ผลต่อยอดหนี้คงค้าง (+ = เราเป็นหนี้เพิ่ม)
const LOAN={borrow:{label:'กู้ยืม',hint:'ยืมเงินเข้ามา',sign:1},repay:{label:'ชำระหนี้',hint:'ผ่อน/คืนเงินกู้',sign:-1},lend:{label:'ให้ยืม',hint:'ให้คนอื่นยืม',sign:-1},collect:{label:'รับชำระคืน',hint:'เขาคืนเงินเรา',sign:1}};
const DEFAULT_PARTIES=['Thani','Kbank','ไทยเครดิต'];
// หมวดเริ่มต้น (จากไฟล์ Cashflow Excel เดิม) — สร้างให้ครั้งแรกที่ยังไม่มีหมวด · แก้/ซ่อน/เพิ่มได้ในหน้าหมวด
const DEFAULT_CATS={in:['ค่าขนส่ง SCG','ค่าขนส่ง TATA','ค่าขนส่ง GIR','ค่าขนส่งอื่นๆ','รายรับอื่นๆ'],
  exp:['ค่าบรรทุกจ่ายรถร่วม','เชลล์','บูรพาปิโตรเลียม','เงินเดือนพนักงาน','เบี้ยเลี้ยงพนักงาน','ค่าซ่อมแซม','ค่ายางรถยนต์','ค่าตำรวจ','ค่าใช้จ่ายต่างๆ','ค่าประกันสินค้า','ค่าพรบ.','ค่าทะเบียนภาษี','ค่าโทรศัพท์','ค่าน้ำไฟ','ค่าใช้จ่ายสำนักงาน','ค่าใช้จ่ายสาขา','ประกันสังคม','ค่าธรรมเนียมธนาคาร']};
const WCOLORS=['#2f6fb0','#e07a2f','#16a34a','#7a5af8','#c0262d','#0e9384','#b54708','#475467'];
const TH_M=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const todayIso=()=>isoOf(new Date());
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=fmt;   // ผู้ใช้ขอทศนิยม 2 ตำแหน่งทุกจุด (08/11/2026)
const thD=iso=>{const p=iso.split('-');return (+p[2])+' '+TH_M[+p[1]];};
const thDY=iso=>{const p=iso.split('-');return (+p[2])+' '+TH_M[+p[1]]+' '+(+p[0]+543);};
const thDW=iso=>TH_DW[new Date(iso+'T00:00:00').getDay()]+', '+thDY(iso);
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ช่อง <input type=date> ต้องเป็น ค.ศ. — ถ้าพิมพ์ปี พ.ศ. (เช่น 2569) จะได้ปี ค.ศ. 2569 → แปลงกลับ (−543)
const fixYear=iso=>{if(!iso||typeof iso!=='string')return iso;const y=+iso.slice(0,4);return y>=2400?(y-543)+iso.slice(4):iso;};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
// "1000+250-12" → 1238 (รับเฉพาะตัวเลขและ + - * / ( ) .)
function calcExpr(s){s=String(s||'').replace(/,/g,'').replace(/^=/,'').trim();if(!s)return NaN;if(!/^[0-9+\-*/().\s]+$/.test(s))return NaN;try{const v=Function('"use strict";return ('+s+')')();return (typeof v==='number'&&isFinite(v))?Math.round(v*100)/100:NaN;}catch(e){return NaN;}}

// ===================== ชั้นข้อมูล =====================
// โหมดทดลอง (?demo) ใช้ข้อมูลในหน่วยความจำ ไม่แตะ Supabase
const DEMO=/[?&]demo\b/.test(location.search);
let sb=null;
const MEM={_id:0,cf_settings:[],cf_accounts:[],cf_parties:[],cf_categories:[],cf_txns:[],cf_recurring:[],cf_budgets:[]};
const DB={
  async init(){if(DEMO)return;sb=supabase.createClient(CF_SUPABASE_URL,CF_SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}});},
  async session(){if(DEMO)return {user:{email:'demo@example.com'}};const {data}=await sb.auth.getSession();return data.session;},
  async login(email,pass){const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;},
  async logout(){if(DEMO){location.href=location.pathname;return;}await sb.auth.signOut();location.reload();},
  async all(table){if(DEMO)return MEM[table].map(r=>({...r}));let rows=[],from=0;const step=1000;
    const key=table==='cf_settings'?'owner':'id';   // cf_settings ใช้ owner เป็นคีย์ (ไม่มีคอลัมน์ id)
    for(;;){const {data,error}=await sb.from(table).select('*').order(key).range(from,from+step-1);if(error)throw error;rows=rows.concat(data);if(data.length<step)break;from+=step;}return rows;},
  async insert(table,rows){if(DEMO)return rows.map(r=>{const x={...r,id:++MEM._id};MEM[table].push(x);return {...x};});
    let out=[];for(let i=0;i<rows.length;i+=500){const {data,error}=await sb.from(table).insert(rows.slice(i,i+500)).select();if(error)throw error;out=out.concat(data);}return out;},
  async update(table,id,patch){if(DEMO){const r=MEM[table].find(x=>x.id===id);Object.assign(r,patch);return {...r};}
    const {data,error}=await sb.from(table).update(patch).eq('id',id).select().single();if(error)throw error;return data;},
  async remove(table,id){if(DEMO){MEM[table]=MEM[table].filter(x=>x.id!==id);return;}const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error;},
  // insert แบบข้ามแถวซ้ำ (unique onConflict) · คืนเฉพาะแถวที่เพิ่มจริง

  // ลบรายการประมาณการล่วงหน้าของรายการประจำ (ตั้งแต่ fromIso) — รายการที่ยืนยันแล้วไม่แตะ

function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const M=1400;const sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('ย่อรูปไม่สำเร็จ')),'image/jpeg',0.75);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('เปิดไฟล์รูปนี้ไม่ได้ (ลองถ่ายใหม่ หรือแคปหน้าจอสลิป)'));};img.src=url;});}

// ผลต่อยอดของรายการ t ต่อบัญชี aid (บวก = เงินเพิ่ม)
function effectOn(t,aid){
  if(t.kind==='transfer')return (t.account_id===aid?-t.amount:0)+(t.to_account_id===aid?t.amount:0);
  if(t.account_id!==aid)return 0;
  if(t.kind==='adjust')return t.amount;
  if(t.kind==='loan')return (LOAN[t.loan_type]||{sign:0}).sign*t.amount;
  const c=catById(t.category_id);return (c?GRP[c.grp].sign:-1)*t.amount;}
// actual=true → ยอดจริง (ไม่นับประมาณการที่ยังไม่ยืนยัน) ใช้กับยอดบัญชี/ปรับยอด · ไม่ส่ง = ยอดคาดการณ์ (นับประมาณการด้วย เหมือน Excel เดิม)
function acctBalance(a,iso,actual){if(!a||a.opening_date>iso)return 0;let b=a.opening_balance;for(const t of S.txns){if(t.d<a.opening_date||t.d>iso||(actual&&t.planned))continue;b+=effectOn(t,a.id);}return b;}
function scopeBalance(iso,actual){return scopeAccts().reduce((s,a)=>s+acctBalance(a,iso,actual),0);}
// ผลต่อยอดรวมของขอบเขตที่เลือก (โอนระหว่างบัญชีในขอบเขตเดียวกัน = 0)
function scopeEffect(t){return scopeAccts().reduce((s,a)=>s+(t.d>=a.opening_date?effectOn(t,a.id):0),0);}
// ยอดหนี้คงค้างกับ party ณ วันที่ iso (+ = เราเป็นหนี้เขา · − = เขาเป็นหนี้เรา) · actual = ไม่นับประมาณการ
function partyOutstanding(p,iso,actual){let b=p.opening_debt;for(const t of S.txns){if(t.kind!=='loan'||t.party_id!==p.id||t.d>iso||(actual&&t.planned))continue;b+=LOAN[t.loan_type].sign*t.amount;}return b;}
// ===== รายการประจำ: สร้างรายการ "ประมาณการ" ล่วงหน้า REC_AHEAD วัน =====
const REC_AHEAD=90;
const FREQ={daily:'ทุกวัน',weekly:'ทุกสัปดาห์',monthly:'ทุกเดือน',yearly:'ทุกปี'};
function recOccurrences(r,from,to){const out=[];const s=r.start_date;const [sy,sm,sd]=s.split('-').map(Number);const ev=r.every||1;
  for(let k=0;k<3000;k++){let d;
    if(r.freq==='daily')d=addDays(s,k*ev);else if(r.freq==='weekly')d=addDays(s,k*7*ev);
    else{const mAdd=r.freq==='monthly'?k*ev:k*12*ev;let y=sy,m=sm+mAdd;y+=Math.floor((m-1)/12);m=((m-1)%12)+1;d=y+'-'+pad(m)+'-'+pad(Math.min(sd,daysIn(y,m)));}
    if(d>to)break;if(d>=from)out.push(d);}return out;}
function recLabel(r){const dom=+r.start_date.slice(8);return FREQ[r.freq]+(r.freq==='monthly'?' วันที่ '+dom:r.freq==='weekly'?' วัน'+TH_DW[new Date(r.start_date+'T00:00:00').getDay()]:r.freq==='yearly'?' '+thD(r.start_date):'')+(r.end_date?' · ถึง '+thDY(r.end_date):'');}
async function recGenerate(r){if(!r.active)return 0;const today=todayIso();const horizon=addDays(today,REC_AHEAD);
  const from=r.gen_until?addDays(r.gen_until,1):r.start_date;const to=r.end_date&&r.end_date<horizon?r.end_date:horizon;if(from>to)return 0;
  const rows=recOccurrences(r,from,to).map(d=>({kind:r.kind,d,account_id:r.account_id,to_account_id:r.to_account_id||null,category_id:r.category_id||null,party_id:r.party_id||null,loan_type:r.loan_type||null,amount:r.amount,note:r.note||'',planned:true,recurring_id:r.id}));

  await DB.update('cf_recurring',r.id,{gen_until:to});r.gen_until=to;return ins.length;}

function sparkSvg(daily,line){const ks=Object.keys(daily);if(ks.length<2)return '';const vs=ks.map(k=>daily[k]);const mn=Math.min(line,...vs),mx=Math.max(line,...vs);
  const W=600,H=120,P=6;const sx=i=>P+i*(W-2*P)/(ks.length-1),sy=v=>H-P-(v-mn)*(H-2*P)/((mx-mn)||1);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="0" x2="'+W+'" y1="'+sy(line)+'" y2="'+sy(line)+'" stroke="#f04438" stroke-dasharray="5 4" stroke-width="1.5"/><polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="'+vs.map((v,i)=>sx(i).toFixed(1)+','+sy(v).toFixed(1)).join(' ')+'"/></svg>'
    +'<div class="muted" style="display:flex;justify-content:space-between"><span>'+thD(ks[0])+'</span><span>เส้นแดง = เกณฑ์เตือน '+fmt0(line)+'</span><span>'+thD(ks[ks.length-1])+'</span></div>';}

// ===================== ส่งออกตาราง Cashflow (Excel .xlsx) — หน้าตาเดียวกับไฟล์ Excel เดิม =====================
// 1 แผ่น/เดือน "MM-YYYY" · แถว = หมวด (เงินสดเข้า / ชำระหนี้ตามเจ้าหนี้ / ค่าใช้จ่าย) · คอลัมน์ = วันที่ 1..31 + รวม
// ท้ายแผ่น: สุทธิรายวัน · โอน/ปรับยอด · ยอดยกมา · เงินสดคงเหลือรวม · ยอดแต่ละบัญชีรายวัน (นับประมาณการด้วย เหมือน Excel เดิม)
// ขอบเขต = บัญชีที่เลือกอยู่ (Total = บัญชีที่รวมใน Total)
function cashflowSheet(ym){const [y,mo]=ym.split('-').map(Number);const nd=daysIn(y,mo);const iso=d=>ym+'-'+pad(d);const days=[...Array(nd)].map((_,i)=>i+1);
  const mTx=scopeTxns().filter(t=>t.d.slice(0,7)===ym);const cell={};const other=Array(nd+1).fill(0);const add=(k,dd,v)=>{cell[k+'|'+dd]=(cell[k+'|'+dd]||0)+v;};
  mTx.forEach(t=>{const dd=+t.d.slice(8);const e=scopeEffect(t);if(t.kind==='flow')add('c'+t.category_id,dd,t.amount);else if(t.kind==='loan'){if(e>0)add('loanin',dd,e);else if(e<0)add('p'+t.party_id,dd,-e);}else other[dd]+=e;});
  scopeAccts().forEach(a=>{if(a.opening_date.slice(0,7)===ym)other[+a.opening_date.slice(8)]+=a.opening_balance;});
  const usedC=new Set(mTx.filter(t=>t.kind==='flow').map(t=>t.category_id)),usedP=new Set(mTx.filter(t=>t.kind==='loan').map(t=>t.party_id));
  const A=[['วันที่',...days,'รวม']];const R2=v=>Math.round(v*100)/100;
  const sec=(label,rows,totLabel)=>{A.push([label]);const col=days.map(()=>0);rows.forEach(r=>{let t=0;A.push([r.name,...days.map((d,i)=>{const v=cell[r.key+'|'+d]||0;t+=v;col[i]+=v;return v?R2(v):null;}),R2(t)]);});
    A.push([totLabel,...col.map(v=>R2(v)),R2(col.reduce((a,b)=>a+b,0))]);A.push([]);return col;};
  const cIn=sec('เงินสดเข้า',S.cats.filter(c=>c.grp==='in'&&(c.active||usedC.has(c.id))).map(c=>({key:'c'+c.id,name:c.name})).concat([{key:'loanin',name:'เงินยืม/รับชำระคืน'}]),'รวมเงินสดเข้า');
  const cDebt=sec('ชำระหนี้',S.parties.filter(p=>p.active||usedP.has(p.id)).map(p=>({key:'p'+p.id,name:p.name})),'รวมยอดชำระหนี้');
  const cExp=sec('ค่าใช้จ่าย',S.cats.filter(c=>c.grp==='exp'&&(c.active||usedC.has(c.id))).map(c=>({key:'c'+c.id,name:c.name})),'รวมยอดค่าใช้จ่าย');
  const net=days.map((d,i)=>cIn[i]-cDebt[i]-cExp[i]);const dB=dailyBalances(iso(1),iso(nd));const carried=scopeBalance(addDays(iso(1),-1));
  A.push(['คงเหลือเงินสด',...net.map(R2),R2(net.reduce((a,b)=>a+b,0))]);
  if(other.some(v=>v))A.push(['โอน/ปรับยอด/ยอดตั้งต้น',...days.map(d=>other[d]?R2(other[d]):null),R2(other.reduce((a,b)=>a+b,0))]);
  A.push(['ยอดยกมา',...days.map(d=>R2(d===1?carried:dB[iso(d-1)])),R2(carried)]);
  A.push(['เงินสดคงเหลือรวม',...days.map(d=>R2(dB[iso(d)])),R2(dB[iso(nd)])]);A.push([]);
  A.push(['ยอดแต่ละบัญชี']);scopeAccts().forEach(a=>A.push([a.name,...days.map(d=>R2(acctBalance(a,iso(d)))),R2(acctBalance(a,iso(nd)))]));
  A.push(['เงินคงเหลือรวม',...days.map(d=>R2(dB[iso(d)])),R2(dB[iso(nd)])]);
  return A;}
let _xlsxP=null;
function loadXlsx(){if(window.XLSX)return Promise.resolve(window.XLSX);if(_xlsxP)return _xlsxP;
  _xlsxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>{_xlsxP=null;rej(new Error('โหลดตัวสร้างไฟล์ Excel ไม่ได้ (เช็คอินเทอร์เน็ต)'));};document.head.appendChild(sc);});return _xlsxP;}
async function exportCashflowXlsx(fromYm,toYm){let X;try{X=await loadXlsx();}catch(e){alert(e.message);return;}
  const wb=X.utils.book_new();let ym=fromYm;
  for(let guard=0;ym<=toYm&&guard<240;guard++){const A=cashflowSheet(ym);const ws=X.utils.aoa_to_sheet(A);
    const rng=X.utils.decode_range(ws['!ref']);for(let r=rng.s.r;r<=rng.e.r;r++)for(let c=1;c<=rng.e.c;c++){const ce=ws[X.utils.encode_cell({r,c})];if(ce&&ce.t==='n'&&r>0)ce.z='#,##0.00';}
    ws['!cols']=[{wch:26}].concat(A[0].slice(1).map(()=>({wch:12})));ws['!freeze']={xSplit:1,ySplit:1};
    const [y,m]=ym.split('-');X.utils.book_append_sheet(wb,ws,m+'-'+y);
    let [yy,mm]=ym.split('-').map(Number);mm++;if(mm>12){mm=1;yy++;}ym=yy+'-'+pad(mm);}
  const a=S.wallet==='all'?null:acctById(S.wallet);
  X.writeFile(wb,'Cashflow_'+(a?a.name.replace(/[\\/:*?"<>|\s]+/g,'_')+'_':'')+fromYm+(toYm!==fromYm?'_ถึง_'+toYm:'')+'.xlsx');toast('ส่งออกแล้ว');}

          await recGenerate(rr);}}
      catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e));return;}
      lsSet('cf_last_acct',v.account_id);toast(R?'แก้รายการประจำแล้ว':'สร้างรายการประจำแล้ว');closeModal();render();return;}
    let saved;
    try{if(t){row.updated_at=new Date().toISOString();const r=await DB.update('cf_txns',t.id,row);Object.assign(t,{...r,amount:+r.amount});saved=t;}
        else{const [r]=await DB.insert('cf_txns',[row]);saved={...r,amount:+r.amount};S.txns.push(saved);}}catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e));return;}
    // สลิป: อัปโหลดรูปใหม่ / ลบรูปที่เอาออก แล้วเก็บรายชื่อไฟล์ไว้ที่รายการ
    const oldSlips=(t&&t.attachments)||[];const removed=oldSlips.filter(p=>!v.slipKeep.includes(p));
    if(v.slipNew.length||removed.length){const paths=v.slipKeep.slice();
      try{toast('⏳ กำลังอัปโหลดสลิป…');for(let i=0;i<v.slipNew.length;i++){const path=S.uid+'/'+saved.id+'/'+Date.now()+'_'+i+'.jpg';await DB.upload(path,v.slipNew[i].blob);paths.push(path);}
        const r=await DB.update('cf_txns',saved.id,{attachments:paths});saved.attachments=r.attachments||paths;if(removed.length)await DB.removeFiles(removed).catch(()=>{});}
      catch(e){alert('บันทึกรายการแล้ว แต่แนบสลิปไม่สำเร็จ: '+(e.message||e)+(/attachments|bucket|not found/i.test(e.message||'')?'\n(ยังไม่ได้รัน migrate_03_slips.sql ใน Fillbook?)':''));}}
    lsSet('cf_last_acct',v.account_id);toast('บันทึกแล้ว');if(more){v.amount='';v.note='';v.slipKeep=[];v.slipNew=[];draw();}else closeModal();render();};
  draw();}

function renderRecur(){const today=todayIso();
  const row=r=>{const nx=S.txns.filter(x=>x.recurring_id===r.id&&x.planned&&x.d>=today).sort((a,b)=>a.d.localeCompare(b.d))[0];const a=acctById(r.account_id);
    const e=r.kind==='flow'?(GRP[(catById(r.category_id)||{grp:'exp'}).grp].sign):r.kind==='loan'?LOAN[r.loan_type].sign:0;
    return '<div class="row" onclick="openTx(null,null,'+r.id+')">'+txIcon(r)+'<div class="m"><div class="c">'+recTitle(r)+(r.active?'':'<span class="tag late">หยุดอยู่</span>')+'</div>'
      +'<div class="n">'+recLabel(r)+'</div><div class="n">'+(a?esc(a.name):'')+(nx?' · ครั้งถัดไป '+thD(nx.d):'')+(r.note?' · '+esc(r.note):'')+'</div></div>'
      +'<div class="a '+(e>0?'pos':e<0?'neg':'')+'" style="'+(e?'':'color:var(--xfer)')+'">'+(e>0?'+':e<0?'−':'')+fmt(r.amount)+'</div><span class="chev">›</span></div>';};
  const act=S.recur.filter(r=>r.active),off=S.recur.filter(r=>!r.active);
  let h=migrateNote();
  if(!S.recur.length)h+='<div class="card empty"><div style="font-size:40px">🔁</div><h2>ยังไม่มีรายการประจำ</h2><div>เช่น เงินเดือนทุกวันที่ 25 · ผ่อน Kbank ทุกเดือน · ค่าน้ำไฟ</div><div class="savebar" style="margin-top:14px"><button class="btn pri" onclick="openTx(null,{rule:true})">+ เพิ่มรายการประจำ</button></div></div>';
  if(act.length){let mon=0;act.forEach(r=>{const e=r.kind==='flow'?GRP[(catById(r.category_id)||{grp:'exp'}).grp].sign:r.kind==='loan'?LOAN[r.loan_type].sign:0;const k={daily:30,weekly:4.345,monthly:1,yearly:1/12}[r.freq]/(r.every||1);mon+=e*r.amount*k;});
    h+='<div class="card"><div style="display:flex;justify-content:space-between"><span class="muted">ผลต่อเงินสดโดยประมาณต่อเดือน</span><b class="'+(mon<0?'neg':'pos')+'">'+(mon<0?'−':'+')+fmt(Math.abs(mon))+'</b></div></div>';
    h+='<div class="sec-t">ใช้งานอยู่</div><div class="card">'+act.map(row).join('')+'</div>';}
  if(off.length)h+='<div class="sec-t">หยุดชั่วคราว</div><div class="card">'+off.map(row).join('')+'</div>';
  h+='<div class="muted" style="padding:0 4px">ระบบสร้างรายการ "ประมาณการ" ล่วงหน้า '+REC_AHEAD+' วันทุกครั้งที่เปิดแอป · เมื่อจ่าย/รับจริงกด ✓ ที่รายการ · แก้รายการประจำ = ปรับรายการล่วงหน้าที่ยังไม่ยืนยันให้ตาม</div>';
  $('#main').innerHTML=h;}

// ===================== หน้า: งบประมาณ =====================
function budgetUsage(ym){const out={};scopeTxns().forEach(t=>{if(t.kind!=='flow'||t.d.slice(0,7)!==ym)return;const c=catById(t.category_id);if(!c||c.grp!=='exp')return;
    const o=out[c.id]=out[c.id]||{act:0,plan:0};if(t.planned)o.plan+=t.amount;else o.act+=t.amount;});return out;}
function renderBudget(){const [y,mo]=S.ym.split('-').map(Number);const nd=daysIn(y,mo);const today=todayIso();const U=budgetUsage(S.ym);
  const L=S.budgets.map(b=>({b,c:catById(b.category_id),u:U[b.category_id]||{act:0,plan:0}})).filter(x=>x.c).sort((a,b)=>a.c.sort-b.c.sort);
  const tb=L.reduce((s,x)=>s+x.b.amount,0),ta=L.reduce((s,x)=>s+x.u.act,0),tp=L.reduce((s,x)=>s+x.u.plan,0);const left=tb-ta-tp;
  const daysLeft=S.ym===today.slice(0,7)?nd-(+today.slice(8))+1:(S.ym>today.slice(0,7)?nd:0);
  const bar0=0;
  const bar=(b,a,p)=>{const mx=Math.max(b,a+p,1);const over=a+p>b;return '<div style="height:10px;border-radius:6px;background:#eef1ef;overflow:hidden;display:flex;margin-top:6px"><div style="width:'+(a/mx*100)+'%;background:'+(over?'#c0262d':'#16a34a')+'"></div><div style="width:'+(p/mx*100)+'%;background:'+(over?'#f5a3a3':'#c4b5fd')+'"></div></div>';};
  let h=migrateNote();
  if(!L.length)h+='<div class="card empty"><div style="font-size:40px">🎯</div><h2>ยังไม่ได้ตั้งงบประมาณ</h2><div>ตั้งงบรายเดือนให้หมวดค่าใช้จ่าย ใช้ซ้ำทุกเดือน</div><div class="savebar" style="margin-top:14px"><button class="btn pri" onclick="openBudget(null)">+ ตั้งงบประมาณ</button></div></div>';
  else{h+='<div class="card"><div class="muted">งบรวม '+TH_MF[mo]+' '+(y+543)+'</div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:22px">'+fmt(tb)+'</b><span class="'+(left<0?'neg':'pos')+'" style="font-weight:700">'+(left<0?'เกินงบ ':'เหลือ ')+fmt(Math.abs(left))+'</span></div>'
      +bar(tb,ta,tp)+'<div class="muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>ใช้จริง '+fmt(ta)+'</span><span style="color:var(--plan)">ประมาณการ '+fmt(tp)+'</span></div>'
      +(daysLeft&&left>0?'<div class="muted" style="margin-top:4px">เหลือ '+daysLeft+' วัน · ใช้ได้อีกวันละ ≈ '+fmt(left/daysLeft)+'</div>':'')+'</div>';
    h+='<div class="sec-t" style="display:flex;justify-content:space-between;align-items:center">งบตามหมวด<button class="btn sm" onclick="openBudget(null)">+ ตั้งงบ</button></div><div class="card">'
      +L.map(x=>{const rem=x.b.amount-x.u.act-x.u.plan;const pct=x.b.amount?Math.round((x.u.act+x.u.plan)/x.b.amount*100):0;
        return '<div class="row" style="display:block" onclick="openBudget('+x.c.id+')"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>'+esc(x.c.name)+'</b><span class="'+(rem<0?'neg':'')+'" style="font-weight:700;white-space:nowrap">'+(rem<0?'เกิน ':'เหลือ ')+fmt(Math.abs(rem))+'</span></div>'
          +bar(x.b.amount,x.u.act,x.u.plan)+'<div class="muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>'+fmt(x.u.act+x.u.plan)+' / '+fmt(x.b.amount)+'</span><span>'+pct+'%</span></div></div>';}).join('')+'</div>';}
  const un=S.cats.filter(c=>c.grp==='exp'&&!S.budgets.some(b=>b.category_id===c.id)&&U[c.id]);
  if(un.length)h+='<div class="sec-t">ใช้จ่ายในหมวดที่ยังไม่ตั้งงบ</div><div class="card">'+un.map(c=>'<div class="row" onclick="openBudget('+c.id+')"><div class="m"><div class="c" style="font-weight:600">'+esc(c.name)+'</div><div class="n">แตะเพื่อตั้งงบ</div></div><div class="a neg">'+fmt(U[c.id].act+U[c.id].plan)+'</div></div>').join('')+'</div>';
  h+='<div class="muted" style="padding:0 4px">สีเขียว = จ่ายจริงแล้ว · สีม่วง = ประมาณการ · งบใช้ซ้ำทุกเดือน · นับตามบัญชีที่เลือกด้านบน</div>';
  $('#main').innerHTML=h;}
function openBudget(catId){const b=catId?S.budgets.find(x=>x.category_id===catId):null;const cats=S.cats.filter(c=>c.grp==='exp'&&(c.active||c.id===catId)&&(c.id===catId||!S.budgets.some(x=>x.category_id===c.id)));
  if(!cats.length){toast('ทุกหมวดตั้งงบแล้ว');return;}
  $('#modal').innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="top"><button class="hbtn" onclick="closeModal()">✕</button><h3>'+(b?'แก้ไขงบ':'ตั้งงบประมาณ')+'</h3>'+(b?'<button class="hbtn" id="bDel" style="color:var(--out)">🗑</button>':'<span style="width:38px"></span>')+'</div>'
   +'<div class="fgroup"><div class="frow"><div class="fi">⬆</div><div class="fx"><div class="lab">หมวดค่าใช้จ่าย</div><select id="bCat"'+(b?' disabled':'')+'>'+cats.map(c=>'<option value="'+c.id+'"'+(c.id===catId?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div></div>'
   +'<div class="frow"><span class="cur">THB</span><div class="fx"><div class="lab">งบต่อเดือน (ใช้ซ้ำทุกเดือน)</div><input id="bAmt" class="amt" inputmode="decimal" value="'+(b?b.amount:'')+'" placeholder="0"></div></div></div>'
   +'<div class="savebar"><button class="btn pri" id="bSave">บันทึก</button></div></div></div>';
  setTimeout(()=>$('#bAmt').focus(),60);
  $('#bSave').onclick=async()=>{const n=calcExpr($('#bAmt').value);if(!isFinite(n)||n<0){toast('ใส่งบให้ถูกต้อง');return;}const cid=+$('#bCat').value;
    try{if(b){const r=await DB.update('cf_budgets',b.id,{amount:n});b.amount=+r.amount;}else{const [r]=await DB.insert('cf_budgets',[{category_id:cid,amount:n}]);S.budgets.push({...r,amount:+r.amount});}}
    catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e));return;}closeModal();toast('บันทึกแล้ว');render();};
  if($('#bDel'))$('#bDel').onclick=async()=>{if(!confirm('ลบงบหมวดนี้?'))return;try{await DB.remove('cf_budgets',b.id);}catch(e){alert(e.message||e);return;}S.budgets=S.budgets.filter(x=>x.id!==b.id);closeModal();render();};}

// ===================== หน้า: หมวด =====================
function renderCats(){let h='';GRP_ORDER.forEach(g=>{h+='<div class="sec-t" style="display:flex;justify-content:space-between;align-items:center">'+GRP[g].label+'<button class="btn sm" data-add="'+g+'">+ เพิ่มหมวด</button></div><div class="card">'
    +S.cats.filter(c=>c.grp===g).map(c=>'<div class="row" style="cursor:default"><div class="ic sm" style="background:'+GRP[g].color+'">'+GRP[g].icon+'</div><div class="m"><div class="c" style="font-weight:600;'+(c.active?'':'color:#98a2b3;text-decoration:line-through')+'">'+esc(c.name)+'</div></div>'
      +'<button class="btn sm" data-mv="'+c.id+'|-1">↑</button><button class="btn sm" data-mv="'+c.id+'|1">↓</button><button class="btn sm" data-rn="'+c.id+'">แก้</button><button class="btn sm" data-tg="'+c.id+'">'+(c.active?'ซ่อน':'แสดง')+'</button></div>').join('')+'</div>';});
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const g=b.dataset.add;const n=(prompt('ชื่อหมวดใหม่ ('+GRP[g].label+')')||'').trim();if(!n)return;const mx=Math.max(-1,...S.cats.filter(c=>c.grp===g).map(c=>c.sort));try{const [r]=await DB.insert('cf_categories',[{grp:g,name:n,sort:mx+1,active:true}]);S.cats.push(r);}catch(e){alert(/duplicate|unique/i.test(e.message||'')?'มีหมวดชื่อนี้แล้ว':(e.message||e));return;}render();});
  document.querySelectorAll('[data-rn]').forEach(b=>b.onclick=async()=>{const c=catById(+b.dataset.rn);const n=(prompt('ชื่อหมวด',c.name)||'').trim();if(!n||n===c.name)return;try{await DB.update('cf_categories',c.id,{name:n});c.name=n;}catch(e){alert(e.message||e);}render();});
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const c=catById(+b.dataset.tg);try{await DB.update('cf_categories',c.id,{active:!c.active});}catch(e){alert(e.message||e);return;}c.active=!c.active;render();});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{const [id,dir]=b.dataset.mv.split('|').map(Number);const c=catById(id);const list=S.cats.filter(x=>x.grp===c.grp);const i=list.indexOf(c),j=i+dir;if(j<0||j>=list.length)return;
    list.splice(i,1);list.splice(j,0,c);for(let k=0;k<list.length;k++){if(list[k].sort!==k){list[k].sort=k;await DB.update('cf_categories',list[k].id,{sort:k});}}
    S.cats.sort((a,b)=>GRP_ORDER.indexOf(a.grp)-GRP_ORDER.indexOf(b.grp)||a.sort-b.sort||a.id-b.id);render();});}

// ===================== เริ่มแอป =====================
function seedDemo(){const t=todayIso();MEM.cf_settings=[{warn_below:100000}];
  const A=(n,b,inc)=>{const x={id:++MEM._id,name:n,opening_balance:b,opening_date:addDays(t,-40),in_total:inc,sort:MEM.cf_accounts.length,active:true};MEM.cf_accounts.push(x);return x.id;};
  const scb=A('SCB 283961 - 0815724665',420000,true),kb=A('Kbank 33151-8',180000,true),cash=A('เงินสด',25000,true);A('JV Store/บ้านน้ำแหวว',41400,false);
  GRP_ORDER.forEach(g=>DEFAULT_CATS[g].forEach((n,i)=>MEM.cf_categories.push({id:++MEM._id,grp:g,name:n,sort:i,active:true})));const C=n=>MEM.cf_categories.find(c=>c.name===n).id;
  DEFAULT_PARTIES.forEach((n,i)=>MEM.cf_parties.push({id:++MEM._id,name:n,opening_debt:[1200000,350000,480000][i],sort:i,active:true}));const P=n=>MEM.cf_parties.find(p=>p.name===n).id;
  const Lo=(dd,acct,party,lt,amt,plan,note)=>MEM.cf_txns.push({id:++MEM._id,kind:'loan',d:addDays(t,dd),account_id:acct,to_account_id:null,category_id:null,party_id:P(party),loan_type:lt,amount:amt,note:note||'',planned:!!plan});
  const T=(dd,acct,cat,amt,plan,note)=>MEM.cf_txns.push({id:++MEM._id,kind:'flow',d:addDays(t,dd),account_id:acct,to_account_id:null,category_id:C(cat),amount:amt,note:note||'',planned:!!plan});
  T(-20,scb,'ค่าขนส่ง GIR',865168.8,0,'INV 10/69');T(-15,scb,'ค่าบรรทุกจ่ายรถร่วม',532447.76,0,'งวด 15 ต.ค.');T(-10,kb,'เชลล์',164385.9,0);Lo(-5,kb,'Kbank','repay',50000,0,'งวด ต.ค.');T(-2,cash,'เบี้ยเลี้ยงพนักงาน',21550,0);
  T(-1,scb,'ค่าขนส่ง SCG',50000,1);T(0,cash,'ค่าซ่อมแซม',4350,0,'ร้านยางแก่งคอย');T(3,scb,'ค่าขนส่ง TATA',700000,1);T(5,scb,'ค่าบรรทุกจ่ายรถร่วม',900000,1,'งวด 15 พ.ย.');T(8,kb,'เงินเดือนพนักงาน',100000,1);Lo(12,kb,'ไทยเครดิต','repay',121800,1);Lo(-8,scb,'Thani','borrow',300000,0,'วงเงินหมุนเวียน');T(20,scb,'ค่าขนส่ง GIR',500000,1);
  MEM.cf_txns.push({id:++MEM._id,kind:'transfer',d:addDays(t,-3),account_id:scb,to_account_id:kb,category_id:null,amount:100000,note:'',planned:false});
  MEM.cf_recurring.push({id:++MEM._id,kind:'flow',account_id:kb,to_account_id:null,category_id:C('ค่าน้ำไฟ'),party_id:null,loan_type:null,amount:8000,note:'การไฟฟ้า',freq:'monthly',every:1,start_date:addDays(t,6),end_date:null,gen_until:null,active:true});
  MEM.cf_recurring.push({id:++MEM._id,kind:'loan',account_id:kb,to_account_id:null,category_id:null,party_id:P('Kbank'),loan_type:'repay',amount:50000,note:'ค่างวด',freq:'monthly',every:1,start_date:addDays(t,25),end_date:null,gen_until:null,active:true});
  [['ค่าซ่อมแซม',70000],['เบี้ยเลี้ยงพนักงาน',20000],['ค่าบรรทุกจ่ายรถร่วม',1200000],['ค่าน้ำไฟ',10000]].forEach(([n,a])=>MEM.cf_budgets.push({id:++MEM._id,category_id:C(n),amount:a}));}
async function start(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0);});
  $('#fab').onclick=()=>openTx(null);
  $('#lgBtn').onclick=async()=>{$('#lgErr').textContent='';try{await DB.login($('#lgEmail').value.trim(),$('#lgPass').value);location.reload();}catch(e){$('#lgErr').textContent='เข้าสู่ระบบไม่สำเร็จ: '+(e.message||e);}};
  $('#lgPass').onkeydown=e=>{if(e.key==='Enter')$('#lgBtn').click();};
  if(DEMO)seedDemo();
  else if(CF_SUPABASE_URL.includes('YOUR-')){document.body.innerHTML='<div class="login"><div class="card">ยังไม่ได้ตั้งค่า Supabase URL / anon key ในไฟล์ index.html</div></div>';return;}
  await DB.init();const sess=await DB.session();if(!sess){$('#loginView').classList.remove('hide');return;}
  S.email=(sess.user&&sess.user.email)||'';S.uid=(sess.user&&sess.user.id)||'demo';
  $('#appView').classList.remove('hide');$('#main').innerHTML='<div class="muted">⏳ กำลังโหลด…</div>';
  try{await loadAll();}catch(e){$('#main').innerHTML='<div class="card neg">โหลดข้อมูลไม่ได้: '+esc(e.message||e)+'</div>';return;}
  render();
  try{if(await recGenerateAll())render();}catch(e){console.warn(e);}}
start();
</script>
