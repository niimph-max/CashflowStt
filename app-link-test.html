<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบลิงก์เปิดแอปธนาคาร</title>
<meta name="robots" content="noindex">
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f3f7f6;color:#1d2b28;margin:0 auto;padding:16px;max-width:520px}
h1{font-size:20px}h2{font-size:17px;margin:22px 0 8px}
p{font-size:14px;color:#56655f;line-height:1.5}
a.t{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #d6ddd9;border-radius:12px;padding:12px 14px;margin:6px 0;text-decoration:none;color:inherit;font-size:15px;font-weight:700}
a.t b{font-size:13px;color:#8a9893;font-weight:500}
.k a.t{border-left:5px solid #138f2d}.s a.t{border-left:5px solid #4e2a84}
</style></head><body>
<h1>ทดสอบลิงก์เปิดแอปธนาคาร</h1>
<p>เปิดหน้านี้ใน <b>Safari</b> แล้วกดทีละปุ่ม<br>
• ถ้า Safari ขึ้นว่า "ที่อยู่ไม่ถูกต้อง" → ใช้ไม่ได้ กดปิดแล้วลองปุ่มถัดไป<br>
• ถ้าขึ้น "เปิดใน K BIZ / SCB…?" หรือแอปเปิดขึ้นมา → <b>ใช้ได้</b> จดเลขปุ่มนั้นไว้ (เช่น K3, S5)</p>
<div class="k"><h2>K BIZ (กสิกร)</h2><div id="k"></div></div>
<div class="s"><h2>SCB Business Anywhere</h2><div id="s"></div></div>
<script>
const K=['kbiz://','kbankbiz://','kbank-kbiz://','kbizapp://','kbiz-app://','kplusbiz://','com.kasikornbank.kbiz://','kasikornbank.kbiz://','kbank://'];
const S=['scbbusinessanywhere://','scbanywhere://','scbbiz://','scbbusiness://','scbcorporate://','scb-corporate://','com.scb.corporate://','scb.corporate://','scbba://','businessanywhere://'];
const draw=(id,list,p)=>document.getElementById(id).innerHTML=list.map((u,i)=>'<a class="t" href="'+u+'"><span>'+p+(i+1)+'</span><b>'+u+'</b></a>').join('');
draw('k',K,'K');draw('s',S,'S');
</script></body></html>
